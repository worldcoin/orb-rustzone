name: CI
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ta:
    name: TA
    # Skip ordinary fork runs. pull_request workflows are PR-controlled, so
    # GitHub's fork-token restrictions remain required; this guard is not an
    # independent security boundary if those protections change.
    if: ${{ !startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/ta.yaml
    with:
      prod: false
      source: ${{ github.sha }}
      cargo_profile: release
    permissions:
      contents: read
      id-token: write
    secrets: inherit
